<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shifa Pro</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #002a68;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: linear-gradient(160deg, #002a68 0%, #06357c 60%, #0a4a9e 100%);
        color: #fff;
        transition: opacity 0.4s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      .splash-mark {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #aee3fd;
        display: grid;
        place-items: center;
        box-shadow: 0 12px 32px rgba(2, 20, 50, 0.4);
        animation: pulse 1.2s ease-in-out infinite;
        padding: 12px;
      }
      .splash-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .splash-name {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .splash-sub {
        font-size: 13px;
        opacity: 0.72;
      }
      .splash-spinner {
        width: 26px;
        height: 26px;
        margin-top: 8px;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: #aee3fd;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-mark"><img src="./logo.png" alt="Shifa" /></div>
      <div class="splash-name">Shifa Pro</div>
      <div class="splash-sub">Pharmacy management</div>
      <div class="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
